<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    background-color: #e6f2ff;

    padding: 20px;

}

.container {

h1 {

}

.subtitle {
    text-align: center;

    color: #415a77;
    font-size: 16px;
    margin-bottom: 30px;
}

/* ── CSS TABS ── */
.tab-radio { display: none; }

.tab-labels {
    display: flex;
    justify-content: center;
    background-color: #e8eef3;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 40px;
    border: 1px solid #ccd8e0;
}

.tab-label {
    flex: 1;
    text-align: center;
    padding: 16px 20px;
    font-family: Tahoma, Arial, sans-serif;
    font-size: 15px;
    color: #415a77;
    cursor: pointer;
    transition: background-color 0.3s ease, color 0.3s ease;
    border-right: 1px solid #ccd8e0;
    user-select: none;
}

.tab-label:last-child { border-right: none; }
.tab-label:hover { background-color: #d4e4ec; color: #005f73; }

/* Active tab style */
#tab1:checked ~ .tab-labels label[for="tab1"],
#tab2:checked ~ .tab-labels label[for="tab2"],
#tab3:checked ~ .tab-labels label[for="tab3"] {
    background-color: #005f73;
    color: white;
    font-weight: bold;
}

/* Tab content */
.tab-content { display: none; }

#tab1:checked ~ .tab-contents .content1,
#tab2:checked ~ .tab-contents .content2,
#tab3:checked ~ .tab-contents .content3 {
    display: block;
}

.tab-contents { margin-top: 10px; }

/* GALLERY */
.category-description {
    text-align: center;
    font-family: Tahoma, Arial;
    color: #415a77;
    font-size: 14px;
    margin-bottom: 25px;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
    justify-items: center;
}

.image-link img {
    width: 100%;
    max-width: 250px;
    height: 200px;
    border-radius: 16px;
    opacity: 0.65;
    object-fit: cover;
    transition: all 0.3s ease;
    cursor: pointer;
}

img.border:hover  { opacity: 1; border: 4px ridge lime; transform: scale(1.05); }
img.border2:hover { opacity: 1; border: 4px dashed orange; transform: scale(1.05); }
img.box1:hover    { opacity: 1; box-shadow: 10px 10px 15px orange; transform: scale(1.05); }
img.box2:hover    { opacity: 1; box-shadow: 10px 10px 45px 5px fuchsia; transform: scale(1.05); }
img.box3:hover    { opacity: 1; box-shadow: 0 0 10px 3px rgba(99,255,119,0.75); transform: scale(1.05); }
img.box3          { border: 3px solid #ddd; }
img.box4:hover    { opacity: 1; box-shadow: 0 0 15px 4px rgba(100,149,237,0.8); transform: scale(1.05); }
img.box5:hover    { opacity: 1; box-shadow: 0 0 15px 4px rgba(255,105,180,0.8); transform: scale(1.05); }

/* NAV */
.nav-btn {
    background-color: #005f73;
    color: white;
    padding: 12px 20px;
    text-decoration: none;
    border-radius: 5px;
    margin: 5px;
    font-family: Tahoma, Arial, sans-serif;
    font-size: 13px;
    display: inline-block;
    transition: all 0.3s ease;
}
.nav-btn:hover { background-color: #007a8a; transform: translateY(-2px); }
.nav-current {
    background-color: #0a9396;
    color: white;
    padding: 12px 20px;
    border-radius: 5px;
    display: inline-block;
    margin: 5px;
    font-family: Tahoma, Arial, sans-serif;
    font-size: 13px;
    font-weight: bold;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
}
.btn-white { background-color: white; color: #005f73; border: 2px solid #005f73; }
.btn-white:hover { background-color: #f0f0f0; }

/* RESPONSIVE */
@media screen and (max-width: 960px) {
    .gallery-grid { grid-template-columns: repeat(4, 1fr); }
}
@media screen and (max-width: 768px) {
    h1 { font-size: 28px; }
    .gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .nav-btn, .nav-current { display: block; width: 100%; margin: 4px 0; text-align: center; }
    .tab-label { font-size: 13px; padding: 12px 8px; }
}
@media screen and (max-width: 480px) {
    body { padding: 10px; }
    h1 { font-size: 22px; }
    .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .image-link img { height: 140px; }
    .tab-label { font-size: 11px; padding: 10px 5px; }
}
</style>
